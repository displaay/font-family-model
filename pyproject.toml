[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "font-family-model"
# single source of truth: __version__ in src/font_family_model/__init__.py,
# which is also what the release workflow checks the tag against
dynamic = ["version"]
description = "OpenType family model: name, fvar and STAT kept consistent with the outlines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Displaay Type Foundry" }]
keywords = ["opentype", "fonts", "variable-fonts", "STAT", "fvar", "name-table"]
dependencies = [
    # 4.62.1 is a floor, not a preference: instantiateVariableFont only rebases
    # a variable font's default safely from that version on, and the rebase
    # refuses to run below it.
    "fonttools>=4.62.1,<5",
]

[project.optional-dependencies]
# glyphsLib is needed only to build the GSFont fixtures the tests of the
# source readers take; the package itself never imports it.
test = ["pytest>=7", "glyphsLib>=6.12,<7"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "glyphsLib>=6.12,<7"]

[project.urls]
Homepage = "https://github.com/displaay/font-family-model"

[tool.setuptools.dynamic]
version = { attr = "font_family_model.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The rules that catch defects rather than style: pyflakes finds dead code and
# undefined names, bugbear the traps that look correct. The wider set the
# sibling package uses (ANN, UP, N) reports 171 findings here, nearly all of
# them missing annotations in code written before it had any -- worth doing,
# but as its own change rather than smuggled into a release.
select = ["E9", "F", "B", "I"]

[tool.mypy]
python_version = "3.10"
# Checked as source rather than as an installed package: there is no py.typed
# marker, because the package does not yet claim to ship types -- most of
# variable.py predates the annotations.
files = ["src/font_family_model"]
# Not strict for the same reason, plus: variable.py speaks to fontTools table
# objects, which ship no stubs, so strict mode would be a wall of Any
# complaints rather than a check.
ignore_missing_imports = true

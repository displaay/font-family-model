[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "font-family-model"
# single source of truth: __version__ in src/font_family_model/__init__.py,
# which is also what the release workflow checks the tag against
dynamic = ["version"]
description = "OpenType family model: name, fvar and STAT kept consistent with the outlines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Displaay Type Foundry" }]
keywords = ["opentype", "fonts", "variable-fonts", "STAT", "fvar", "name-table"]
dependencies = [
    # 4.62.1 is a floor, not a preference: instantiateVariableFont only rebases
    # a variable font's default safely from that version on, and the rebase
    # refuses to run below it.
    "fonttools>=4.62.1,<5",
]

[project.optional-dependencies]
# glyphsLib is needed only to build the GSFont fixture one test reads Axis
# Values from; the package itself never imports it.
test = ["pytest>=7", "glyphsLib>=6.12,<7"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "glyphsLib>=6.12,<7"]

[project.urls]
Homepage = "https://github.com/displaay/font-family-model"

[tool.setuptools.dynamic]
version = { attr = "font_family_model.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

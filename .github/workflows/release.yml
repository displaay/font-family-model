name: release

on:
  push:
    tags: ["v*"]

# Released through GitHub Releases rather than PyPI, the way the sibling
# packages are: the two consumers pin an asset URL, pip fetches a built wheel
# over plain HTTPS, and the build image needs no git. Publishing to PyPI stays
# available later - unlike a name, a release is not one-way.
#
#   font-family-model @ https://github.com/displaay/font-family-model/releases/download/v0.1.0/font_family_model-0.1.0-py3-none-any.whl

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Safety net: never release a tag whose tests fail. The full matrix runs
      # in ci.yml on every push to main; this is a single-version smoke run.
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Check the tag matches the packaged version
        run: |
          version="$(python -c 'import font_family_model; print(font_family_model.__version__)')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ $version" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - name: Publish the wheel as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
